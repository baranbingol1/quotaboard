name: Release

# Tag-driven: pushing v0.1.0 builds both architectures and publishes the
# release. workflow_dispatch is for rehearsing the build without a tag —
# it uploads artifacts and stops short of creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tags do not trigger ci.yml (it matches branches: [main] only), so without
  # this job a tag on an untested or red commit would still ship.
  tests:
    name: Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore tests/AiLimits.Tests/AiLimits.Tests.csproj

      - name: Test
        run: >
          dotnet test tests/AiLimits.Tests/AiLimits.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=tests.trx"
          --results-directory TestResults
          --blame-hang-timeout 5m
          --blame-hang-dump-type none

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  build:
    name: Build (${{ matrix.arch }})
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    # id-token + attestations are for the provenance attestation step.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # A tag that disagrees with Directory.Build.props would ship binaries
      # whose file version contradicts their download name. Fail loudly here
      # rather than let someone discover it after the release is public.
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.Version
          if (-not $version) { throw 'No <Version> in Directory.Build.props.' }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
              $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
              if ($tag -ne "v$version") {
                  throw "Tag $tag does not match <Version> $version. Update one of them."
              }
          }
          Write-Host "Version $version"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained (${{ matrix.arch }})
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
        run: >-
          ./scripts/publish-ai-limits.ps1
          -Architecture ${{ matrix.arch }}
          -Configuration Release
          -OutputPath $env:PUBLISH_DIR

      - name: Validate publish output
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
        run: >-
          ./scripts/validate-publish.ps1
          -Architecture ${{ matrix.arch }}
          -OutputPath $env:PUBLISH_DIR

      # SignPath is the trusted path: set the SIGNPATH_ENABLED variable to
      # true and provide the SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID
      # secrets plus the project/policy slugs below. Without them the
      # fallback step signs with a throwaway self-signed certificate instead,
      # so the signing path is still exercised end to end.
      - name: Upload unsigned binaries for SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
          if-no-files-found: error

      - name: Prepare clean SignPath output directory
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNED_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}-signed
        run: |
          Remove-Item -LiteralPath $env:SIGNED_DIR -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:SIGNED_DIR | Out-Null

      - name: Sign with SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}-signed

      - name: Self-signed test signing (fallback)
        if: vars.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
        run: ./scripts/sign-release.ps1 -PublishDir $env:PUBLISH_DIR

      - name: Validate signed output
        shell: pwsh
        env:
          UNSIGNED_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
          SIGNED_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}-signed
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          if ($env:SIGNPATH_ENABLED -eq 'true') {
              if (-not (Test-Path -LiteralPath $env:SIGNED_DIR -PathType Container)) {
                  throw "SignPath did not produce $env:SIGNED_DIR"
              }
              $relativeInventory = {
                  param($root)
                  @(Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
                      [System.IO.Path]::GetRelativePath($root, $_.FullName)
                  } | Sort-Object)
              }
              $unsigned = & $relativeInventory $env:UNSIGNED_DIR
              $signed = & $relativeInventory $env:SIGNED_DIR
              $difference = @(Compare-Object $unsigned $signed)
              if ($difference.Count -gt 0) {
                  $detail = ($difference | ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" }) -join "`n"
                  throw "SignPath output inventory differs from unsigned input:`n$detail"
              }
              $selected = $env:SIGNED_DIR
          } else {
              $selected = $env:UNSIGNED_DIR
          }

          ./scripts/validate-publish.ps1 -Architecture ${{ matrix.arch }} -OutputPath $selected
          if ($LASTEXITCODE -ne 0) { throw "Signed publish validation exited $LASTEXITCODE" }
          ./scripts/verify-signatures.ps1 -RootPath $selected -RequireTrustedSignature ($env:SIGNPATH_ENABLED -eq 'true')
          if ($LASTEXITCODE -ne 0) { throw "Signature verification exited $LASTEXITCODE" }
          "PUBLISH_DIR=$selected" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # microsoft/sbom-tool ships as a standalone binary rather than a pinned
      # action, so the download is pinned by version and sha256 instead.
      - name: Generate SBOM
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'sbom-tool.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe' -OutFile $tool
          $expected = '625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5'
          $actual = (Get-FileHash $tool -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "sbom-tool sha256 mismatch: expected $expected, got $actual" }
          & $tool generate -b $env:PUBLISH_DIR -bc . -pn QuotaBoard -pv "${{ steps.version.outputs.version }}" -nsb 'https://github.com/baranbingol1/quotaboard'
          if ($LASTEXITCODE -ne 0) { throw "sbom-tool exited $LASTEXITCODE" }
          $manifest = Join-Path $env:PUBLISH_DIR '_manifest\spdx_2.2\manifest.spdx.json'
          if (-not (Test-Path $manifest)) { throw "SBOM was not generated at $manifest" }
          # Ship the SBOM as its own release asset, not inside the zip: it
          # describes the zip's contents and should be verifiable separately.
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $manifest "dist\QuotaBoard-${{ steps.version.outputs.version }}-win-${{ matrix.arch }}.sbom.spdx.json"
          Remove-Item (Join-Path $env:PUBLISH_DIR '_manifest') -Recurse -Force

      - name: Package
        shell: pwsh
        run: |
          $name = "QuotaBoard-${{ steps.version.outputs.version }}-win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Compress the folder's contents, not the folder: the archive should
          # unpack into whatever directory the user chose, not a nested one.
          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "dist\$name.zip.sha256" -Encoding ascii
          Write-Host "$name.zip  $hash"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.zip

      - name: Upload package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: package-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Upload binlog on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: binlog-${{ matrix.arch }}
          path: "**/*.binlog"
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      # Notes live in a file rather than a heredoc: a heredoc terminator has
      # to sit at column 0, which YAML block indentation cannot give it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "$TAG" dist/* \
            --title "QuotaBoard $TAG" \
            --notes-file .github/release-body.md \
            --draft \
            --verify-tag

  # Re-download the draft assets and re-check them. Verifying the build
  # artifacts on disk would miss corruption or tampering during upload.
  verify:
    name: Verify release assets
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download $env:TAG --dir dist `
            --pattern '*.zip' --pattern '*.zip.sha256' --pattern '*.spdx.json'

      - name: Verify hashes, signatures, attestation, and SBOM
        shell: pwsh
        env:
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/verify-release.ps1
          -DistDir dist
          -RequireTrustedSignature ($env:SIGNPATH_ENABLED -eq 'true')
          -Repository $env:GITHUB_REPOSITORY

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit $env:TAG --draft=false
