name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; jobs opt in to more if they ever need it.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: CSharpier
        run: dotnet csharpier check src tests

      - name: Large files, complexity, debt, duplicates
        shell: pwsh
        run: ./scripts/invoke-quality-gates.ps1 -SkipFormat

  tests:
    name: Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          # NuGet only; never cache bin/ or obj/.
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: >
          dotnet restore tests/AiLimits.Tests/AiLimits.Tests.csproj;
          dotnet restore tests/AiLimits.IntegrationTests/AiLimits.IntegrationTests.csproj

      - name: Unit tests
        run: >
          dotnet test tests/AiLimits.Tests/AiLimits.Tests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults/unit
          --blame-hang-timeout 5m
          --blame-hang-dump-type none
          --settings tests/coverlet.runsettings

      - name: Integration tests
        run: >
          dotnet test tests/AiLimits.IntegrationTests/AiLimits.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults/integration
          --blame-hang-timeout 5m
          --blame-hang-dump-type none
          --settings tests/coverlet.runsettings

      - name: Coverage threshold
        shell: pwsh
        run: ./scripts/quality/Assert-Coverage.ps1 -ResultsDirectory TestResults/unit,TestResults/integration -Minimum 40

      - name: Test duration assertion
        shell: pwsh
        run: ./scripts/quality/Assert-TestDurations.ps1 -ResultsDirectory TestResults/unit -MaxSeconds 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  publish:
    name: Publish (${{ matrix.arch }})
    needs: [quality, tests, audit]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish self-contained (${{ matrix.arch }})
        shell: pwsh
        env:
          # Keep the publish output off the workspace; both publish and
          # validate must agree on the path.
          PUBLISH_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
        run: >-
          ./scripts/publish-ai-limits.ps1
          -Architecture ${{ matrix.arch }}
          -Configuration Release
          -OutputPath $env:PUBLISH_DIR

      - name: Validate publish output
        shell: pwsh
        env:
          PUBLISH_DIR: ${{ runner.temp }}\AiLimits\release\win-${{ matrix.arch }}
        run: >-
          ./scripts/validate-publish.ps1
          -Architecture ${{ matrix.arch }}
          -OutputPath $env:PUBLISH_DIR

      - name: Upload binlog on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: binlog-${{ matrix.arch }}
          path: "**/*.binlog"
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Audit high-severity dependencies
        run: dotnet list src/AiLimits.App/AiLimits.App.csproj package --vulnerable --include-transitive
